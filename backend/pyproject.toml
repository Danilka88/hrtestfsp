[project]
name = "it-talent-match-backend"
version = "0.1.0"
description = "API бизнес-логики платформы обратного подбора ИТ-специалистов"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
