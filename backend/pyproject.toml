[project]
name = "it-talent-match-backend"
version = "0.1.0"
description = "API бизнес-логики платформы обратного подбора ИТ-специалистов"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
# ВАЖНО: штатный C-трассировщик coverage в этом окружении (Python 3.12, macOS)
# занижает покрытие — проверено сравнением на одном файле и одном прогоне:
# 42% через ctrace против 90% через sysmon. Ядро sysmon (PEP 669) даёт
# достоверные цифры, поэтому включено по умолчанию: иначе измерения вводят
# в заблуждение и заставляют «дописывать» тесты на уже покрытый код.
core = "sysmon"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Базовый набор плюс семейства, которые проверяют осмысленность кода:
# C4 — лишние включения, ERA — закомментированный код, RET — лишние
# переменные перед return, SIM — упрощаемые конструкции, PTH — pathlib
# вместо os.path. Все находки исправлены, набор удерживается чистым.
select = ["E", "F", "I", "UP", "B", "C4", "ERA", "RET", "SIM", "PTH"]
ignore = [
    # FastAPI: Depends()/Query()/File() в значениях по умолчанию — идиома фреймворка,
    # а не ошибка «вызов функции в аргументе по умолчанию».
    "B008",
]
